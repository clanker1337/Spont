name: Bug report
description: Report a defect in Spont
title: "bug: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the defect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser, demo vs live mode, commit/PR.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - frontend
        - domain
        - engine
        - providers
        - security
        - testing
        - infrastructure
        - documentation
    validations:
      required: false
