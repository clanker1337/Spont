name: Feature / Task
description: A product or engineering piece of work tracked as an issue
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User or engineering outcome
      description: What is accomplished when this is done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
      description: What is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test requirements
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: M0
    validations:
      required: true
  - type: checkboxes
    id: labels
    attributes:
      label: Labels (area/priority)
      options:
        - label: priority:p1
        - label: area:frontend
        - label: area:domain
        - label: area:engine
        - label: area:providers
        - label: area:security
        - label: area:testing
        - label: area:infrastructure
        - label: area:documentation
